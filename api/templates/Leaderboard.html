{% extends "base.html" %}

{% block title %}The Big O-Block - TOP{% endblock %}

{% block content %}
  <h1>TOP 5 Rezultāti</h1>
  <table>
    <tr><th>#</th><th>Spēlētājs</th><th>Punkti</th></tr>
    {% for row in rows %}
    <tr{% if loop.first %} class="first"{% endif %}>
      <td>{{ loop.index }}</td>
      <td><a href="/players/{{ row.player | urlencode }}">{{ row.player }}</a></td>
      <td>{{ row.score }}</td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
